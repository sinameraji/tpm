name = "tpm-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tpm-prod"
database_id = "a0cc8e09-f7a4-46c3-97e9-4bc3a56d8e71"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "b48b253ab6a245bcbc93a92d2c123fac"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "3f844ff272b04c629aaa854ef41ec18e"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "tpm-artifacts"

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
TPM_API_VERSION = "v1"
ENV = "production"

[env.dev]
[env.dev.vars]
ENV = "dev"

# Wire up after the usetpm.dev zone is added to Cloudflare:
# routes = [
#   { pattern = "api.usetpm.dev/*", zone_name = "usetpm.dev" }
# ]
